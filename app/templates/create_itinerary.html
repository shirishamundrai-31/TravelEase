
{% extends "base.html" %}

{% block title %}Plan Your Trip | TravelEase{% endblock %}

{% block content %}
<section class="container py-3">

    <div class="text-center mb-4">
        <span class="badge text-bg-primary mb-2">Your next adventure</span>
        <h1 class="fw-bold">Create Your Travel Itinerary</h1>
        <p class="text-secondary">
            Organize your destination, dates, and travel notes in one place.
        </p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">

            <div class="card border-0 shadow-sm itinerary-form-card">
                <div class="card-body p-4 p-md-5">

                    <form method="POST"
                          action="{{ url_for('main.create_itinerary') }}">

                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">
                                Trip Name
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                placeholder="Example: Summer Vacation"
                                maxlength="120"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="destination"
                                   class="form-label fw-semibold">
                                Destination
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="destination"
                                name="destination"
                                placeholder="Example: Manali, Himachal Pradesh"
                                maxlength="150"
                                required
                            >
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="start_date"
                                       class="form-label fw-semibold">
                                    Start Date
                                </label>
                                <input
                                    type="date"
                                    class="form-control"
                                    id="start_date"
                                    name="start_date"
                                    required
                                >
                            </div>

                            <div class="col-md-6">
                                <label for="end_date"
                                       class="form-label fw-semibold">
                                    End Date
                                </label>
                                <input
                                    type="date"
                                    class="form-control"
                                    id="end_date"
                                    name="end_date"
                                    required
                                >
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="notes"
                                   class="form-label fw-semibold">
                                Travel Notes
                            </label>
                            <textarea
                                class="form-control"
                                id="notes"
                                name="notes"
                                rows="4"
                                maxlength="2000"
                                placeholder="Activities, places to visit, budget ideas..."
                            ></textarea>
                        </div>

                        <div class="d-flex flex-column flex-sm-row gap-2">
                            <button type="submit"
                                    class="btn btn-primary btn-lg flex-grow-1">
                                <i class="bi bi-calendar-check me-2"></i>
                                Save Itinerary
                            </button>

                            <a href="{{ url_for('main.itineraries') }}"
                               class="btn btn-outline-secondary btn-lg">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>
            </div>

            <p class="text-secondary small text-center mt-3">
                Your itinerary is saved to your TravelEase account.
            </p>

        </div>
    </div>

</section>
{% endblock %}
